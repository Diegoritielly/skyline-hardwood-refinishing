<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="skylineLogoTitle">
  <title id="skylineLogoTitle">Skyline Remodeling &amp; Construction</title>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D573"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F2F2"/>
      <stop offset="50%" stop-color="#C7C9CC"/>
      <stop offset="100%" stop-color="#9AA0A6"/>
    </linearGradient>
  </defs>

  <!-- Roof / house outline -->
  <path d="M60 78 L120 32 L180 78" fill="none" stroke="url(#silverGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="100" y="18" width="12" height="22" fill="url(#silverGrad)"/>

  <!-- S ribbon -->
  <path d="M92 62 L92 108 L120 130 L148 108 L148 62 L120 40 Z" fill="none"/>
  <path d="M100 58 C100 58 148 58 148 90 C148 112 118 108 118 108 C118 108 92 106 92 128"
        fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- window -->
  <g fill="url(#silverGrad)">
    <rect x="108" y="98" width="8" height="8"/>
    <rect x="120" y="98" width="8" height="8"/>
    <rect x="108" y="110" width="8" height="8"/>
    <rect x="120" y="110" width="8" height="8"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="4" fill="url(#silverGrad)">SKYLINE</text>
  <text x="200" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3" fill="url(#goldGrad)">REMODELING &amp; CONSTRUCTION</text>
</svg>
